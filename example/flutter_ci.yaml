# example/flutter_ci.yaml
#
# Copy this file to your Flutter project root as flutter_ci.yaml
# and adjust to your team's needs.

version: 1

checks:
  analyze:
    enabled: true
    fatal_warnings: true
    fatal_infos: false

  format:
    enabled: true
    line_length: 80

  test:
    enabled: true
    coverage:
      enabled: true
      minimum_percent: 80       # fail if coverage drops below 80 %
    exclude:
      - "**/*.g.dart"
      - "**/*.freezed.dart"

  build:
    enabled: true
    platforms:
      - apk
      - web

output:
  terminal:
    enabled: true
    verbose: false
  html_report:
    enabled: true
    output_path: "ci_reports/report.html"
  json_report:
    enabled: false
    output_path: "ci_reports/report.json"

hooks:
  pre_push:
    enabled: true
    on_failure: ask
    auto_install: true
